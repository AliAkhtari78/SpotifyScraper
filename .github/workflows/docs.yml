name: Docs

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - ".github/workflows/docs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      # All extras so mkdocstrings can import optional-dependency code paths
      # (e.g. the browser transport) without ImportError during introspection.
      - run: uv sync --group docs --all-extras
      # Strict build: any broken link, missing nav target, or mkdocstrings
      # path error fails CI.
      - run: uv run mkdocs build --strict
